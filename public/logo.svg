      <rect width="64" height="64" fill="#fff"/>
      <path d="M34 24H48A10 10 0 0 1 58 34V40A10 10 0 0 1 54 49V56L47 50H34A10 10 0 0 1 24 40V34A10 10 0 0 1 34 24Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#aisparring-bg)"/>
  <g transform="translate(5.6 4.4) scale(.825)">
    <!-- human bubble -->
    <g mask="url(#aisparring-gap)">
      <path d="M16 10H30A10 10 0 0 1 40 20V26A10 10 0 0 1 30 36H17L10 42V35A10 10 0 0 1 6 26V20A10 10 0 0 1 16 10Z" fill="#fff"/>
