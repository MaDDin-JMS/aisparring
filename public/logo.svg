      <circle cx="29" cy="19" r="2.4" fill="#6366f1"/>
    </g>
    <!-- AI bubble with spark -->
    <path d="M34 24H48A10 10 0 0 1 58 34V40A10 10 0 0 1 54 49V56L47 50H34A10 10 0 0 1 24 40V34A10 10 0 0 1 34 24Z" fill="#2dd4bf"/>
    <path d="M41 29.5C41.8 34.2 43.3 35.7 48 36.5C43.3 37.3 41.8 38.8 41 43.5C40.2 38.8 38.7 37.3 34 36.5C38.7 35.7 40.2 34.2 41 29.5Z" fill="#fff"/>
  </g>
</svg>
