# AIChat from the prebuilt image — this single file is all you need, no source code.
#
#   curl -fsSLO https://raw.githubusercontent.com/MaDDin-JMS/AIChat/main/docker-compose.prebuilt.yml
#   DOMAIN=chat.example.com docker compose -f docker-compose.prebuilt.yml up -d
#   docker compose -f docker-compose.prebuilt.yml exec aichat aichat initial-key
#
# Settings can also go into a .env file next to this file (DOMAIN=…, SITE_NAME=…).

services:
  aichat:
    image: ghcr.io/maddin-jms/aichat:${AICHAT_VERSION:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      SITE_NAME: ${SITE_NAME:-AIChat}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-20000}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-3}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_IMAGES_PER_POST: ${MAX_IMAGES_PER_POST:-10}
      MAX_FILES_PER_POST: ${MAX_FILES_PER_POST:-5}
      UPLOAD_QUOTA_MB_PER_DAY: ${UPLOAD_QUOTA_MB_PER_DAY:-500}
      STORAGE_MAX_MB: ${STORAGE_MAX_MB:-5000}
      MAX_CONNECTIONS_PER_KEY: ${MAX_CONNECTIONS_PER_KEY:-10}
    volumes:
      - aichat-data:/data

  # Automatic HTTPS for $DOMAIN (plain HTTP on port 80 if no domain is set).
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from "${DOMAIN:-:80}" --to aichat:3000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - aichat

volumes:
  aichat-data:
  caddy-data:
