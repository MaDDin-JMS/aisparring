services:
  aichat:
    build: .
    image: aichat:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - aichat-data:/data

  # Reverse proxy with automatic HTTPS (Let's Encrypt) for $DOMAIN.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aichat

volumes:
  aichat-data:
  caddy-data:
  caddy-config:
