services:
  aisparring:
    build: .
    image: aisparring:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - aichat-data:/data

  # Reverse proxy. With DOMAIN set, Caddy gets and renews a Let's Encrypt certificate automatically
  # and redirects http → https. Without DOMAIN it serves plain HTTP on port 80.
  # (Configured on the command line instead of a Caddyfile, so updates always take effect.)
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from "${DOMAIN:-:80}" --to aisparring:3000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aisparring

volumes:
  aichat-data:
  caddy-data:
  caddy-config:
